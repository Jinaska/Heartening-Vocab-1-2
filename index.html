<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7b5fe0">
<title>英単語 LOVE YOURSELF 💜 | 高1 中間テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#7b5fe0; --purple-d:#5e44c4; --purple-l:#9d7bff;
    --pink:#ff8fb1; --bg-card:#f4f0ff; --ink:#3a3550; --ink-soft:#8a83a8;
    --ok:#1fae6c; --ok-bg:#e4f7ee; --ng:#e85b73; --ng-bg:#fde8ec;
    --gold:#ffb13b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:linear-gradient(160deg,#c9b8ff 0%,#9b7df0 45%,#6f51d6 100%);
    background-attachment:fixed;
    min-height:100%;
    color:var(--ink);
    display:flex;justify-content:center;align-items:flex-start;
    padding:14px;
  }
  .app{
    width:100%;max-width:520px;
    background:#fff;border-radius:26px;
    box-shadow:0 24px 60px rgba(60,30,120,.4);
    padding:20px 18px 26px;
    position:relative;overflow:hidden;
  }
  .screen{animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .hidden{display:none !important;}

  /* ---- top bar ---- */
  .topbar{display:flex;align-items:center;gap:8px;margin-bottom:6px;min-height:34px;}
  .icon-btn{
    border:none;background:var(--bg-card);color:var(--purple-d);
    border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    transition:transform .12s;
  }
  .icon-btn:active{transform:scale(.9);}
  .topbar .spacer{flex:1;}
  .topbar-title{font-weight:800;color:var(--purple-d);font-size:15px;}

  /* ---- home ---- */
  h1.logo{
    text-align:center;font-size:24px;font-weight:800;color:var(--purple-d);
    letter-spacing:.5px;margin-top:4px;line-height:1.3;
  }
  h1.logo .heart{display:inline-block;animation:beat 1.4s ease-in-out infinite;}
  @keyframes beat{0%,100%{transform:scale(1);}45%{transform:scale(1.25);}}
  .tagline{text-align:center;color:var(--ink-soft);font-size:12.5px;margin:6px 0 14px;font-weight:500;}

  .streak{
    text-align:center;font-size:13px;font-weight:700;color:var(--gold);
    background:#fff7e6;border-radius:14px;padding:7px 10px;margin-bottom:14px;
  }

  /* zukan */
  .zukan-box{background:var(--bg-card);border-radius:18px;padding:13px 12px;margin-bottom:16px;}
  .zukan-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .zukan-head b{font-size:13.5px;color:var(--purple-d);}
  .zukan-head .count{font-size:12px;color:var(--ink-soft);font-weight:700;}
  .zukan-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .member{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:default;}
  .m-coin{
    width:100%;aspect-ratio:1;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;color:#fff;font-weight:800;
    box-shadow:inset 0 -3px 6px rgba(0,0,0,.15);
  }
  .m-coin.locked{background:#e3def2;color:#b9b1d4;box-shadow:none;}
  .member.got{cursor:pointer;}
  .member.got:active{transform:scale(.92);}
  .m-name{font-size:8.5px;color:var(--ink-soft);font-weight:700;text-align:center;line-height:1;}
  .m-name.locked{color:#c5bedd;}

  /* mode buttons */
  .menu{display:flex;flex-direction:column;gap:11px;}
  .mode-btn{
    border:none;cursor:pointer;text-align:left;
    background:linear-gradient(135deg,var(--purple),var(--purple-l));
    color:#fff;border-radius:18px;padding:15px 16px;
    display:flex;align-items:center;gap:13px;
    font-family:inherit;transition:transform .12s,box-shadow .12s;
    box-shadow:0 7px 16px rgba(123,95,224,.32);
  }
  .mode-btn:active{transform:scale(.97);}
  .mode-btn .emoji{font-size:27px;flex:0 0 auto;}
  .mode-btn .txt b{display:block;font-size:16px;font-weight:800;}
  .mode-btn .txt span{display:block;font-size:11.5px;opacity:.92;margin-top:2px;font-weight:500;}
  .mode-btn.review{background:linear-gradient(135deg,#ff8fb1,#ffa9c4);box-shadow:0 7px 16px rgba(255,143,177,.4);}
  .mode-btn.study{background:linear-gradient(135deg,#56c2b0,#74d6c6);box-shadow:0 7px 16px rgba(86,194,176,.36);}
  .mode-btn.match{background:linear-gradient(135deg,#f0a93b,#ffc065);box-shadow:0 7px 16px rgba(240,169,59,.4);}
  .badge{
    margin-left:auto;background:rgba(255,255,255,.28);
    border-radius:11px;padding:3px 9px;font-size:12px;font-weight:800;flex:0 0 auto;
  }

  /* ---- setup screen ---- */
  .setup-h{text-align:center;font-size:19px;font-weight:800;color:var(--purple-d);margin:6px 0 4px;}
  .setup-sub{text-align:center;color:var(--ink-soft);font-size:12px;margin-bottom:16px;}
  .pick-label{font-size:12.5px;font-weight:800;color:var(--purple-d);margin:14px 0 8px;}
  .pick-row{display:flex;gap:8px;flex-wrap:wrap;}
  .pick{
    flex:1;min-width:80px;border:2.5px solid #e7e1fb;background:#fff;
    border-radius:14px;padding:12px 8px;cursor:pointer;font-family:inherit;
    font-size:13.5px;font-weight:700;color:var(--ink);transition:all .14s;text-align:center;
  }
  .pick small{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:600;margin-top:2px;}
  .pick.sel{border-color:var(--purple);background:var(--bg-card);color:var(--purple-d);}
  .pick.sel small{color:var(--purple);}
  .start-btn{
    width:100%;border:none;cursor:pointer;font-family:inherit;
    background:linear-gradient(135deg,var(--purple),var(--purple-l));
    color:#fff;font-size:17px;font-weight:800;border-radius:16px;
    padding:15px;margin-top:22px;box-shadow:0 8px 18px rgba(123,95,224,.36);
    transition:transform .12s;
  }
  .start-btn:active{transform:scale(.97);}

  /* ---- progress ---- */
  .qtop{display:flex;justify-content:space-between;align-items:center;font-size:12px;
    color:var(--ink-soft);font-weight:700;margin-bottom:6px;}
  .qtop .scoredot{color:var(--purple-d);}
  .pbar{height:9px;background:#ece7fb;border-radius:6px;overflow:hidden;margin-bottom:18px;}
  .pbar>div{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,var(--purple),var(--pink));transition:width .35s;}

  /* ---- quiz ---- */
  .qcard{
    background:var(--bg-card);border-radius:18px;padding:24px 16px;
    text-align:center;margin-bottom:14px;
  }
  .q-tag{
    display:inline-block;background:var(--purple);color:#fff;font-size:10.5px;
    font-weight:700;padding:3px 10px;border-radius:9px;margin-bottom:10px;
  }
  .q-main{font-size:27px;font-weight:800;color:var(--ink);line-height:1.35;word-break:break-word;}
  .q-ipa{font-size:13px;color:var(--ink-soft);margin-top:6px;font-style:italic;}
  .q-sub{font-size:12px;color:var(--ink-soft);margin-top:8px;}
  .choices{display:flex;flex-direction:column;gap:9px;}
  .choice{
    border:2.5px solid #e7e1fb;background:#fff;border-radius:14px;
    padding:14px 15px;font-size:15.5px;font-weight:700;cursor:pointer;
    font-family:inherit;color:var(--ink);text-align:left;transition:all .12s;
    display:flex;align-items:center;gap:9px;
  }
  .choice .num{
    flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:var(--bg-card);
    color:var(--purple-d);font-size:12px;display:flex;align-items:center;justify-content:center;
  }
  .choice:active:not(:disabled){transform:scale(.98);}
  .choice:disabled{cursor:default;}
  .choice.correct{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);}
  .choice.correct .num{background:var(--ok);color:#fff;}
  .choice.wrong{border-color:var(--ng);background:var(--ng-bg);color:var(--ng);}
  .choice.wrong .num{background:var(--ng);color:#fff;}

  /* feedback + next */
  .feedback{
    text-align:center;font-weight:800;font-size:15px;margin-top:14px;
    padding:11px;border-radius:13px;display:none;
  }
  .feedback.show{display:block;animation:pop .3s ease;}
  @keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  .feedback.ok{background:var(--ok-bg);color:var(--ok);}
  .feedback.ng{background:var(--ng-bg);color:var(--ng);}
  .next-btn{
    width:100%;border:none;cursor:pointer;font-family:inherit;margin-top:12px;
    background:linear-gradient(135deg,var(--purple),var(--purple-l));
    color:#fff;font-size:15.5px;font-weight:800;border-radius:14px;padding:14px;
    transition:transform .12s;
  }
  .next-btn:active{transform:scale(.97);}

  /* ---- typing ---- */
  .type-input{
    width:100%;border:2.5px solid #e7e1fb;border-radius:14px;
    padding:15px;font-size:19px;font-family:inherit;font-weight:700;
    color:var(--ink);text-align:center;outline:none;transition:border .14s;
  }
  .type-input:focus{border-color:var(--purple);}
  .type-input.ok{border-color:var(--ok);background:var(--ok-bg);}
  .type-input.ng{border-color:var(--ng);background:var(--ng-bg);}
  .ghint{text-align:center;font-size:11.5px;color:var(--ink-soft);margin-top:8px;}
  .skip-btn{
    background:none;border:none;color:var(--ink-soft);font-family:inherit;
    font-size:12px;cursor:pointer;text-decoration:underline;margin-top:10px;width:100%;
  }

  /* ---- flashcard ---- */
  .flash{perspective:1300px;height:270px;margin:6px 0 16px;cursor:pointer;}
  .flash-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.4,.2,.2,1);}
  .flash.flip .flash-in{transform:rotateY(180deg);}
  .flash-face{
    position:absolute;width:100%;height:100%;backface-visibility:hidden;
    -webkit-backface-visibility:hidden;border-radius:20px;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:22px;text-align:center;
  }
  .flash-front{background:linear-gradient(140deg,var(--purple),var(--purple-l));color:#fff;
    box-shadow:0 10px 24px rgba(123,95,224,.4);}
  .flash-back{background:#fff;border:3px solid var(--purple);transform:rotateY(180deg);}
  .fc-word{font-size:34px;font-weight:800;word-break:break-word;}
  .fc-ipa{font-size:15px;opacity:.85;margin-top:8px;font-style:italic;}
  .fc-mean{font-size:26px;font-weight:800;color:var(--ink);line-height:1.35;}
  .fc-def{font-size:12px;color:var(--ink-soft);margin-top:14px;line-height:1.5;}
  .fc-pos{font-size:11px;background:rgba(255,255,255,.25);padding:3px 10px;border-radius:8px;margin-top:10px;}
  .flash-back .fc-pos{background:var(--bg-card);color:var(--purple-d);}
  .fc-tap{font-size:11px;opacity:.8;margin-top:14px;}
  .speak-btn{
    border:none;background:rgba(255,255,255,.25);color:#fff;border-radius:50%;
    width:38px;height:38px;font-size:17px;cursor:pointer;margin-top:12px;
  }
  .flash-back .speak-btn{background:var(--bg-card);}

  /* ---- matching ---- */
  .match-grid{display:flex;gap:10px;}
  .match-col{flex:1;display:flex;flex-direction:column;gap:9px;}
  .mcard{
    border:2.5px solid #e7e1fb;background:#fff;border-radius:13px;
    padding:14px 8px;font-size:14px;font-weight:700;cursor:pointer;
    font-family:inherit;color:var(--ink);text-align:center;
    min-height:58px;display:flex;align-items:center;justify-content:center;
    transition:all .13s;word-break:break-word;line-height:1.3;
  }
  .mcard:active:not(.done){transform:scale(.96);}
  .mcard.sel{border-color:var(--purple);background:var(--bg-card);
    box-shadow:0 0 0 3px rgba(123,95,224,.18);}
  .mcard.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);
    opacity:.55;pointer-events:none;}
  .mcard.shake{animation:shk .35s;border-color:var(--ng);background:var(--ng-bg);}
  @keyframes shk{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .match-info{text-align:center;font-size:12px;color:var(--ink-soft);font-weight:700;margin-bottom:14px;}

  /* ---- result ---- */
  .result{text-align:center;}
  .result .big-emoji{font-size:54px;animation:beat 1.2s ease infinite;}
  .result h2{font-size:21px;color:var(--purple-d);font-weight:800;margin:6px 0;}
  .scorenum{
    font-size:50px;font-weight:800;margin:8px 0;
    background:linear-gradient(135deg,var(--purple),var(--pink));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .result .msg{color:var(--ink-soft);font-size:14px;margin-bottom:16px;font-weight:600;}
  .wrongbox{
    background:#fff6f8;border-radius:14px;padding:12px;margin:14px 0;
    text-align:left;max-height:200px;overflow-y:auto;
  }
  .wrongbox h3{font-size:12.5px;color:var(--ng);margin-bottom:7px;}
  .wrong-item{font-size:13px;padding:6px 2px;border-bottom:1px dashed #f1d6dd;}
  .wrong-item:last-child{border-bottom:none;}
  .wrong-item b{color:var(--ink);}
  .wrong-item .jp{color:var(--ink-soft);}
  .result .start-btn{margin-top:10px;}
  .result .ghost{
    background:#fff;color:var(--purple-d);border:2.5px solid #e7e1fb;
    box-shadow:none;
  }

  /* ---- celebrate ---- */
  #screen-celebrate{
    background:linear-gradient(165deg,#cab9ff,#8a6cef 70%,#6a4fd0);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    margin:-20px -18px -26px;padding:42px 22px;min-height:600px;text-align:center;
  }
  .cele-top{color:#fff;font-size:13px;font-weight:800;letter-spacing:1px;
    background:rgba(255,255,255,.2);padding:6px 16px;border-radius:20px;}
  .cele-new{
    margin-top:14px;background:var(--gold);color:#fff;font-weight:800;font-size:12px;
    padding:4px 14px;border-radius:12px;animation:beat 1s ease infinite;
  }
  .cele-card{
    background:#fff;border-radius:24px;padding:26px 20px;margin-top:16px;
    width:100%;max-width:340px;box-shadow:0 18px 44px rgba(40,10,90,.45);
    animation:pop .5s cubic-bezier(.3,1.5,.5,1);
  }
  .cele-avatar{
    width:110px;height:110px;border-radius:50%;margin:0 auto 6px;
    display:flex;align-items:center;justify-content:center;font-size:46px;
    box-shadow:inset 0 -7px 14px rgba(0,0,0,.18);animation:bob 2.4s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
  .cele-name{font-size:25px;font-weight:800;margin-top:6px;}
  .cele-sub{font-size:12px;color:var(--ink-soft);font-weight:700;margin-bottom:12px;}
  .cele-msg{font-size:15px;font-weight:700;color:var(--ink);line-height:1.5;}
  .cele-msg.en{color:var(--purple-d);font-style:italic;margin-bottom:8px;}
  .cele-btn{
    margin-top:18px;border:none;cursor:pointer;font-family:inherit;
    background:#fff;color:var(--purple-d);font-weight:800;font-size:15px;
    border-radius:14px;padding:13px 30px;box-shadow:0 6px 16px rgba(0,0,0,.2);
  }
  .cele-btn:active{transform:scale(.96);}

  /* confetti */
  .confetti{position:fixed;top:-20px;width:10px;height:14px;border-radius:2px;
    z-index:9999;pointer-events:none;}
  @keyframes fall{
    to{transform:translateY(115vh) rotate(720deg);opacity:.9;}
  }

  /* word list */
  .wl-search{
    width:100%;border:2.5px solid #e7e1fb;border-radius:12px;padding:10px 12px;
    font-family:inherit;font-size:14px;outline:none;margin-bottom:10px;
  }
  .wl-item{
    display:flex;align-items:center;gap:10px;padding:10px 6px;
    border-bottom:1px solid #f0ecfb;
  }
  .wl-item .en{font-weight:800;font-size:14.5px;color:var(--ink);}
  .wl-item .ipa{font-size:11px;color:var(--ink-soft);}
  .wl-item .jp{margin-left:auto;font-size:13px;color:var(--purple-d);font-weight:700;text-align:right;}
  .wl-pos{font-size:10px;background:var(--bg-card);color:var(--purple-d);
    padding:2px 7px;border-radius:7px;font-weight:700;flex:0 0 auto;}
  .wl-wrap{max-height:62vh;overflow-y:auto;}

  @media(max-width:380px){
    .q-main{font-size:23px;}
    .fc-word{font-size:29px;}
    .m-coin{font-size:12px;}
  }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ============ HOME ============ -->
  <section id="screen-home" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="sound-btn" title="音">🔊</button>
      <div class="spacer"></div>
      <button class="icon-btn" id="help-btn" title="あそびかた">？</button>
    </div>
    <h1 class="logo">英単語 <span class="heart">💜</span> LOVE YOURSELF</h1>
    <p class="tagline">高1・1学期 中間テスト対策 ／ Lesson 1 &amp; 2（全91語）</p>

    <div class="streak hidden" id="streak-box"></div>

    <div class="zukan-box">
      <div class="zukan-head">
        <b>💜 BTS メンバーずかん</b>
        <span class="count" id="zukan-count">0 / 7</span>
      </div>
      <div class="zukan-grid" id="zukan-grid"></div>
      <p style="font-size:10.5px;color:var(--ink-soft);margin-top:9px;text-align:center;font-weight:600;">
        10問ぜんぶ正解すると、メンバーが1人ずつ仲間入り！
      </p>
    </div>

    <div class="menu">
      <button class="mode-btn study" data-mode="flashcard">
        <span class="emoji">🃏</span>
        <span class="txt"><b>カードでおぼえる</b><span>めくって意味をチェック</span></span>
      </button>
      <button class="mode-btn" data-mode="quiz">
        <span class="emoji">✏️</span>
        <span class="txt"><b>4択クイズ</b><span>英→日 ／ 日→英 をえらぶ</span></span>
      </button>
      <button class="mode-btn" data-mode="typing">
        <span class="emoji">⌨️</span>
        <span class="txt"><b>うちこみクイズ</b><span>スペルや意味をタイプ</span></span>
      </button>
      <button class="mode-btn match" data-mode="matching">
        <span class="emoji">🧩</span>
        <span class="txt"><b>マッチング</b><span>単語と意味をペアにしよう</span></span>
      </button>
      <button class="mode-btn review" data-mode="review">
        <span class="emoji">🔁</span>
        <span class="txt"><b>まちがい復習</b><span>苦手な単語をやっつけよう</span></span>
        <span class="badge" id="review-badge">0</span>
      </button>
      <button class="mode-btn" data-mode="wordlist" style="background:linear-gradient(135deg,#8a83b8,#a9a2cf);box-shadow:0 7px 16px rgba(138,131,184,.3);">
        <span class="emoji">📖</span>
        <span class="txt"><b>たんご一覧</b><span>91語をぜんぶ見る</span></span>
      </button>
    </div>
  </section>

  <!-- ============ SETUP ============ -->
  <section id="screen-setup" class="screen hidden">
    <div class="topbar">
      <button class="icon-btn back-home">←</button>
      <div class="spacer"></div>
    </div>
    <h2 class="setup-h" id="setup-title"></h2>
    <p class="setup-sub" id="setup-sub"></p>

    <div id="scope-block">
      <div class="pick-label">📚 はんい をえらぶ</div>
      <div class="pick-row" id="scope-row">
        <button class="pick sel" data-scope="all">ぜんぶ<small>91語</small></button>
        <button class="pick" data-scope="1">Lesson 1<small>43語</small></button>
        <button class="pick" data-scope="2">Lesson 2<small>48語</small></button>
      </div>
    </div>

    <div id="dir-block">
      <div class="pick-label">🔄 しゅつだい方向 をえらぶ</div>
      <div class="pick-row" id="dir-row">
        <button class="pick sel" data-dir="en-ja">英語 → 日本語<small>意味を答える</small></button>
        <button class="pick" data-dir="ja-en">日本語 → 英語<small>英語を答える</small></button>
      </div>
    </div>

    <button class="start-btn" id="setup-start">スタート！</button>
  </section>

  <!-- ============ FLASHCARD ============ -->

  /* ============ 永続データ（localStorage） ============ */
  var SAVE_KEY = "lys_vocab_save_v1";
  var save = { collected:[], reviewIds:[], btsIndex:0, streak:0, totalPerfect:0 };
  function loadSave(){
    try{
      var raw = localStorage.getItem(SAVE_KEY);
      if(raw){ var o=JSON.parse(raw);
        save.collected   = o.collected   || [];
        save.reviewIds   = o.reviewIds   || [];
        save.btsIndex    = o.btsIndex    || 0;
        save.streak      = o.streak      || 0;
        save.totalPerfect= o.totalPerfect|| 0;
      }
    }catch(e){}
  }
  function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

  /* ============ 状態 ============ */
  var state = {};
  var QPS = 10;          // 1セットの問題数
  var soundOn = true;

  /* ============ 効果音（Web Audio・ファイル不要） ============ */
  var actx = null;
  function tone(freq, dur, type, when, vol){
    if(!soundOn) return;
    try{
      if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      var o=actx.createOscillator(), g=actx.createGain();
      var t=actx.currentTime+(when||0);
      o.type=type||"sine"; o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  }
  function sndOk(){ tone(660,0.13,"triangle",0); tone(990,0.16,"triangle",0.1); }
  function sndNg(){ tone(220,0.22,"sawtooth",0,0.12); }
  function sndTap(){ tone(520,0.06,"sine",0,0.08); }
  function sndFanfare(){
    var n=[523,659,784,1047,1319];
    n.forEach(function(f,i){ tone(f,0.32,"triangle",i*0.13,0.2); });
  }

  /* ============ ユーティリティ ============ */
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function sample(a,n){ return shuffle(a).slice(0,n); }
  function byId(id){ for(var i=0;i<WORDS.length;i++) if(WORDS[i].id===id) return WORDS[i]; return null; }
  function $(id){ return document.getElementById(id); }

  function scopeWords(scope){
    if(scope==="1") return WORDS.filter(function(w){return w.lesson===1;});
    if(scope==="2") return WORDS.filter(function(w){return w.lesson===2;});
    return WORDS.slice();
  }
  function lessonLabel(w){ return "Lesson "+w.lesson+" - part "+w.part; }

  function showScreen(id){
    var ss=document.querySelectorAll(".screen");
    for(var i=0;i<ss.length;i++) ss[i].classList.add("hidden");
    $(id).classList.remove("hidden");
    $("app").scrollTop=0; window.scrollTo(0,0);
  }

  /* ============ 復習リスト操作 ============ */
  function addReview(id){
    if(save.reviewIds.indexOf(id)<0){ save.reviewIds.push(id); }
  }
  function removeReview(id){
    var i=save.reviewIds.indexOf(id);
    if(i>=0) save.reviewIds.splice(i,1);
  }

  /* ============ セットアップ画面 ============ */

  /* ============ フラッシュカード ============ */
  function startFlashcard(words, dir){

    showScreen("screen-flashcard");
    renderFlash();
  }
  function renderFlash(){
    var w=state.words[state.idx];
    $("flash").classList.remove("flip");
    var posFull={"動":"動詞","名":"名詞","形":"形容詞","副":"副詞","接":"接続詞","句":"熟語・連語"};

  /* ============ 4択クイズ ============ */
  function startQuiz(words, dir, isReview){
    state={words:words, dir:dir, idx:0, correct:0, wrong:[], isReview:isReview, mode:"quiz"};
    $("quiz-title").textContent = isReview ? "🔁 復習クイズ" : "4択クイズ";
    showScreen("screen-quiz");
    renderQuiz();
  }
  function renderQuiz(){
    var w=state.words[state.idx];
    $("q-feedback").className="feedback";
    $("q-next").classList.add("hidden");
    var qMain, ans, pool;
    if(state.dir==="en-ja"){
      qMain=w.word; ans=w.ja;
      $("q-tag").textContent="この単語の意味は？";
      $("q-ipa").textContent=w.ipa?"["+w.ipa+"]":"";
      pool=WORDS.filter(function(x){return x.id!==w.id;}).map(function(x){return x.ja;});
    }else{
      qMain=w.ja; ans=w.word;
      $("q-tag").textContent="この意味の英語は？";
      $("q-ipa").textContent="";
      pool=WORDS.filter(function(x){return x.id!==w.id;}).map(function(x){return x.word;});
    }
    $("q-main").textContent=qMain;
    // 重複をのぞいたダミー
    var uniq=[]; for(var i=0;i<pool.length;i++){ if(pool[i]!==ans && uniq.indexOf(pool[i])<0) uniq.push(pool[i]); }
    var choices=shuffle([ans].concat(sample(uniq,3)));
    var box=$("q-choices"); box.innerHTML="";
    choices.forEach(function(c,i){
      var b=document.createElement("button");
      b.className="choice";
      b.innerHTML='<span class="num">'+(i+1)+'</span><span>'+c+'</span>';
      b.addEventListener("click",function(){ answerQuiz(b,c,ans,w); });
      box.appendChild(b);
    });
    $("q-counter").textContent="問 "+(state.idx+1)+" / "+state.words.length;
    $("q-score").textContent="✓ "+state.correct;
    $("q-bar").style.width=((state.idx)/state.words.length*100)+"%";
  }
  function answerQuiz(btn,chosen,correct,w){
    var cs=document.querySelectorAll("#q-choices .choice");
    for(var i=0;i<cs.length;i++){
      cs[i].disabled=true;
      if(cs[i].querySelector("span:last-child").textContent===correct) cs[i].classList.add("correct");
    }
    var fb=$("q-feedback");
    if(chosen===correct){
      state.correct++; sndOk();
      fb.textContent="⭕ 正解！"; fb.className="feedback ok show";
    }else{
      btn.classList.add("wrong"); sndNg();
      fb.innerHTML="❌ おしい！ 正解は「"+correct+"」";
      fb.className="feedback ng show";
      state.wrong.push(w); addReview(w.id);
    }
    $("q-score").textContent="✓ "+state.correct;
    $("q-bar").style.width=((state.idx+1)/state.words.length*100)+"%";
    var nb=$("q-next");
    nb.textContent=state.idx===state.words.length-1?"結果を見る →":"次の問題 →";
    nb.classList.remove("hidden");
  }
  function nextQuiz(){
    if(state.idx<state.words.length-1){ state.idx++; renderQuiz(); }
    else finishSet("quiz");
  }

  /* ============ うちこみクイズ ============ */
  function startTyping(words, dir, isReview){
    state={words:words, dir:dir, idx:0, correct:0, wrong:[], isReview:isReview, mode:"typing", answered:false};
    showScreen("screen-typing");
    renderTyping();
  }
  function renderTyping(){
    var w=state.words[state.idx];
    state.answered=false;
    $("t-feedback").className="feedback";
    var inp=$("t-input");
    inp.value=""; inp.className="type-input"; inp.disabled=false;
    $("t-check").classList.remove("hidden");
    $("t-next").classList.add("hidden");
    $("t-skip").classList.remove("hidden");
    if(state.dir==="en-ja"){
      $("t-tag").textContent="意味を日本語で入力";
      $("t-main").textContent=w.word;
      $("t-ipa").textContent=w.ipa?"["+w.ipa+"]":"";
      $("t-sub").textContent="";
      inp.placeholder="日本語で答えてね";
    }else{
      $("t-tag").textContent="英語のスペルを入力";
      $("t-main").textContent=w.ja;
      $("t-ipa").textContent="";
      $("t-sub").textContent="ヒント："+w.word.length+"文字";
      inp.placeholder="英語で答えてね";
    }
    $("t-counter").textContent="問 "+(state.idx+1)+" / "+state.words.length;
    $("t-score").textContent="✓ "+state.correct;
    $("t-bar").style.width=((state.idx)/state.words.length*100)+"%";
    setTimeout(function(){ inp.focus(); },120);
  }
  function normEn(s){ return (s||"").toLowerCase().trim().replace(/\s+/g," ").replace(/[.．。]/g,""); }
  function normJa(s){ return (s||"").replace(/[\s　]/g,"").replace(/[～〜]/g,"")
      .replace(/[（）()・,，、；;。.「」]/g,""); }
  function judgeTyping(input,w){
    if(state.dir==="ja-en"){
      return normEn(input)===normEn(w.word) && input.trim().length>0;
    }
    var inp=normJa(input); if(inp.length<1) return false;
    var chunks=w.ja.split(/[、,，・/／;；]/);
    for(var i=0;i<chunks.length;i++){
      var c=normJa(chunks[i]); if(!c) continue;
      if(inp===c) return true;
      if(inp.length>=2 && (c.indexOf(inp)>=0 || inp.indexOf(c)>=0)) return true;
    }
    return false;
  }
  function checkTyping(skip){
    if(state.answered) return;
    var w=state.words[state.idx];
    var inp=$("t-input");
    var ok = !skip && judgeTyping(inp.value,w);
    state.answered=true;
    inp.disabled=true;
    $("t-check").classList.add("hidden");
    $("t-skip").classList.add("hidden");
    var fb=$("t-feedback");
    var ansText = state.dir==="en-ja" ? w.ja : w.word;
    if(ok){
      state.correct++; sndOk();
      inp.classList.add("ok");
      fb.textContent="⭕ 正解！  "+ansText; fb.className="feedback ok show";
    }else{
      sndNg();
      inp.classList.add("ng");
      fb.innerHTML=(skip?"👀 答えはこちら → ":"❌ おしい！ 正解は → ")+
        "<b>"+ansText+"</b>"+(state.dir==="ja-en"&&w.ipa?" ["+w.ipa+"]":"");
      fb.className="feedback ng show";
      state.wrong.push(w); addReview(w.id);
    }
    $("t-score").textContent="✓ "+state.correct;
    $("t-bar").style.width=((state.idx+1)/state.words.length*100)+"%";
    var nb=$("t-next");
    nb.textContent=state.idx===state.words.length-1?"結果を見る →":"次の問題 →";
    nb.classList.remove("hidden");
  }
  function nextTyping(){
    if(state.idx<state.words.length-1){ state.idx++; renderTyping(); }
    else finishSet("typing");
  }

  /* ============ マッチング ============ */
  function startMatching(scope){
    var pool=scopeWords(scope);
    // 意味が重複しない10語をえらぶ
    var picked=[], seen={};
    var sh=shuffle(pool);
    for(var i=0;i<sh.length && picked.length<QPS;i++){
      if(!seen[sh[i].ja]){ seen[sh[i].ja]=1; picked.push(sh[i]); }
    }
    state={mode:"matching", words:picked, boards:[picked.slice(0,5),picked.slice(5,10)],
      board:0, miss:0, wrong:[], matched:0, sel:null};
    showScreen("screen-matching");
    renderBoard();
  }
  function renderBoard(){
    var bd=state.boards[state.board];
    state.matched=0; state.sel=null;
    var left=$("m-left"), right=$("m-right");
    left.innerHTML=""; right.innerHTML="";
    shuffle(bd).forEach(function(w){
      var c=document.createElement("button");
      c.className="mcard"; c.textContent=w.word; c.dataset.wid=w.id; c.dataset.side="L";
      c.addEventListener("click",function(){ tapCard(c); });
      left.appendChild(c);
    });
    shuffle(bd).forEach(function(w){
      var c=document.createElement("button");
      c.className="mcard"; c.textContent=w.ja; c.dataset.wid=w.id; c.dataset.side="R";
      c.addEventListener("click",function(){ tapCard(c); });
      right.appendChild(c);
    });
    var done=state.board*5;
    $("m-counter").textContent="ペア "+done+" / 10";
    $("m-miss").textContent="ミス "+state.miss;
    $("m-bar").style.width=(done/10*100)+"%";
  }
  function tapCard(card){
    if(card.classList.contains("done")) return;
    sndTap();
    if(!state.sel){
      state.sel=card; card.classList.add("sel"); return;
    }
    if(state.sel===card){ card.classList.remove("sel"); state.sel=null; return; }
    if(state.sel.dataset.side===card.dataset.side){
      state.sel.classList.remove("sel"); state.sel=card; card.classList.add("sel"); return;
    }
    // 別サイド → 判定
    var a=state.sel, b=card;
    if(a.dataset.wid===b.dataset.wid){
      a.classList.remove("sel"); a.classList.add("done"); b.classList.add("done");
      state.sel=null; state.matched++; sndOk();
      $("m-counter").textContent="ペア "+(state.board*5+state.matched)+" / 10";
      $("m-bar").style.width=((state.board*5+state.matched)/10*100)+"%";
      if(state.matched===5){
        if(state.board===0){ state.board=1; setTimeout(renderBoard,420); }
        else setTimeout(function(){ finishSet("matching"); },420);
      }
    }else{
      state.miss++; sndNg();
      var w=byId(parseInt(a.dataset.side==="L"?a.dataset.wid:b.dataset.wid,10));
      if(w && state.wrong.indexOf(w)<0){ state.wrong.push(w); addReview(w.id); }
      a.classList.add("shake"); b.classList.add("shake");
      var aa=a,bb=b;
      setTimeout(function(){
        aa.classList.remove("shake","sel"); bb.classList.remove("shake");
      },400);
      state.sel=null;
      $("m-miss").textContent="ミス "+state.miss;
    }
  }

  /* ============ セット終了 → 結果 ============ */
  function finishSet(mode){
    var total, correct, perfect, wrong=state.wrong;
    if(mode==="matching"){
      total=10; correct=10-state.miss; if(correct<0)correct=0;
      perfect=state.miss===0;
    }else{
      total=state.words.length; correct=state.correct;
      perfect=correct===total;
    }
    // 復習モードで正解 → 復習リストから外す
    if(state.isReview){
      state.words.forEach(function(w){
        var stillWrong=false;
        for(var i=0;i<wrong.length;i++) if(wrong[i].id===w.id) stillWrong=true;
        if(!stillWrong) removeReview(w.id);
      });
    }
    // 連続満点
    if(perfect){ save.streak++; save.totalPerfect++; }
    else { save.streak=0; }
    persist();
    state.lastResult={mode:mode,total:total,correct:correct,perfect:perfect,wrong:wrong};
    if(perfect){
      var idx=nextMemberIndex();
      var isNew=save.collected.indexOf(idx)<0;
      if(isNew){ save.collected.push(idx); }
      save.btsIndex=(idx+1)%7;
      persist();
      sndFanfare();
      showCelebrate(idx,isNew,false);
    }else{
      showResult();
    }
  }
  function nextMemberIndex(){
    // まだ集めていないメンバーを優先（ずかんコンプ）
    for(var i=0;i<7;i++){
      var idx=(save.btsIndex+i)%7;
      if(save.collected.indexOf(idx)<0) return idx;
    }
    return save.btsIndex%7;
  }

  /* ============ お祝い画面 ============ */

  /* ============ 結果画面 ============ */
  function showResult(){
    var r=state.lastResult;
    showScreen("screen-result");
    if(r.mode==="matching"){
      $("r-score").textContent="ミス "+state.miss+" 回";
      $("r-head").textContent="マッチング けっか";
    }else{
      $("r-score").textContent=r.correct+" / "+r.total;
      $("r-head").textContent= state.isReview ? "復習けっか" : "けっか はっぴょう";
    }
    var pct=r.correct/r.total, emoji, msg;
    if(r.perfect){ emoji="🏆"; msg="パーフェクト！すごい！"; }
    else if(pct>=0.9){ emoji="😆"; msg="おっしい〜！あと少しで満点だよ！"; }
    else if(pct>=0.7){ emoji="😊"; msg="いい調子！この調子でがんばろう✨"; }
    else if(pct>=0.5){ emoji="💪"; msg="ナイスファイト！復習でぐーんと伸びるよ📈"; }
    else { emoji="🌱"; msg="ここからが伸びどき！復習でばっちりにしよう💜"; }
    $("r-emoji").textContent=emoji;
    $("r-msg").textContent=msg;
    // まちがいリスト
    var wb=$("r-wrongbox"), wl=$("r-wronglist");
    if(r.wrong.length>0){
      wl.innerHTML="";
      r.wrong.forEach(function(w){
        var d=document.createElement("div");
        d.className="wrong-item";
        d.innerHTML='<b>'+w.word+'</b> '+(w.ipa?'<span class="ipa" style="font-size:11px;color:var(--ink-soft);">['+w.ipa+']</span>':'')+
          ' <span class="jp">— '+w.ja+'</span>';
        wl.appendChild(d);
      });
      wb.classList.remove("hidden");
      $("r-review").classList.remove("hidden");
      $("r-review").textContent="🔁 まちがえた"+r.wrong.length+"問を今すぐ復習";
    }else{
      wb.classList.add("hidden");
      $("r-review").classList.add("hidden");
    }
    // もう一度ボタン文言
    $("r-again").textContent = r.mode==="matching" ? "🔄 もう一度マッチング" : "🔄 もう一度（新しい10問）";
  }

  /* ============ 紙吹雪 ============ */
  function confetti(){
    var colors=["#7b6cf6","#ff89ad","#ffb13b","#27c2b1","#56a8ff","#9a8bff","#ff6fae"];
    for(var i=0;i<46;i++){
      (function(){
        var d=document.createElement("div");
        d.className="confetti";
        d.style.left=Math.random()*100+"%";
        d.style.background=colors[Math.floor(Math.random()*colors.length)];
        var dur=2.4+Math.random()*1.8;
        d.style.animation="fall "+dur+"s linear "+(Math.random()*0.5)+"s forwards";
        if(Math.random()<0.5) d.style.borderRadius="50%";
        d.style.width=(6+Math.random()*8)+"px";
        d.style.height=(8+Math.random()*10)+"px";
        document.body.appendChild(d);
        setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },(dur+1)*1000);
      })();
    }
  }

  /* ============ 読み上げ ============ */
  function speak(text){
    try{
      if(!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(text);
      u.lang="en-US"; u.rate=0.92;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ============ たんご一覧 ============ */
  function renderWordList(){
    var filter=document.querySelector("#wl-filter .sel").dataset.wl;
    var q=normEn($("wl-search").value);
    var qj=normJa($("wl-search").value);
    var list=$("wl-list"); list.innerHTML="";
    var arr=WORDS.filter(function(w){
      if(filter!=="all" && w.lesson!==parseInt(filter,10)) return false;
      if(!q && !qj) return true;
      return normEn(w.word).indexOf(q)>=0 || (qj && normJa(w.ja).indexOf(qj)>=0);
    });
    if(arr.length===0){ list.innerHTML='<p style="text-align:center;color:var(--ink-soft);padding:20px;font-size:13px;">見つかりませんでした</p>'; return; }
    arr.forEach(function(w){
      var d=document.createElement("div");
      d.className="wl-item";
      d.innerHTML='<span class="wl-pos">'+w.pos+'</span>'+
        '<span><span class="en">'+w.word+'</span>'+
        (w.ipa?' <span class="ipa">['+w.ipa+']</span>':'')+'</span>'+
        '<span class="jp">'+w.ja+'</span>';
      d.addEventListener("click",function(){ sndTap(); speak(w.word); });
      list.appendChild(d);
    });
  }

  /* ============ イベント ============ */
  document.addEventListener("DOMContentLoaded",function(){
    loadSave();
    renderHome();

    // モードボタン
    var mbs=document.querySelectorAll("[data-mode]");
    for(var i=0;i<mbs.length;i++){
      mbs[i].addEventListener("click",function(){
        sndTap();
        var mode=this.dataset.mode;
        if(mode==="review"){
          if(save.reviewIds.length===0){
            alert("復習リストは空っぽ！\nクイズでまちがえた単語がここに集まるよ💜");
            return;
          }
          var rw=save.reviewIds.map(byId).filter(Boolean);
          startQuiz(sample(rw,Math.min(QPS,rw.length)),
            Math.random()<0.5?"en-ja":"ja-en", true);
        }
        else if(mode==="wordlist"){
          var wf=$("wl-filter").children;
          for(var k=0;k<wf.length;k++) wf[k].classList.toggle("sel",wf[k].dataset.wl==="all");
          $("wl-search").value="";
          renderWordList();
          showScreen("screen-wordlist");
        }
        else openSetup(mode);
      });
    }

    // もどるボタン（全画面共通）
    var backs=document.querySelectorAll(".back-home");
    for(var b=0;b<backs.length;b++){
      backs[b].addEventListener("click",function(){
        sndTap(); renderHome(); showScreen("screen-home");
      });
    }

    // セットアップ scope/dir
    $("scope-row").addEventListener("click",function(e){
      var t=e.target.closest(".pick"); if(!t) return; sndTap();
      var ch=this.children; for(var i=0;i<ch.length;i++) ch[i].classList.remove("sel");
      t.classList.add("sel"); setupCfg.scope=t.dataset.scope;
    });
    $("dir-row").addEventListener("click",function(e){
      var t=e.target.closest(".pick"); if(!t) return; sndTap();
      var ch=this.children; for(var i=0;i<ch.length;i++) ch[i].classList.remove("sel");
      t.classList.add("sel"); setupCfg.dir=t.dataset.dir;
    });
    $("setup-start").addEventListener("click",function(){ sndTap(); startFromSetup(); });

    // フラッシュカード
    $("flash").addEventListener("click",function(e){
      if(e.target.dataset.speak){
        e.stopPropagation();
        speak(state.words[state.idx].word); return;
      }
      this.classList.toggle("flip");
    });
    $("fc-prev").addEventListener("click",function(){
      if(state.idx>0){ state.idx--; renderFlash(); }
    });
    $("fc-next").addEventListener("click",function(){
      if(state.idx<state.words.length-1){ state.idx++; renderFlash(); }
      else { renderHome(); showScreen("screen-home"); }
    });

    // クイズ
    $("q-next").addEventListener("click",function(){ sndTap(); nextQuiz(); });

    // タイピング
    $("t-check").addEventListener("click",function(){ checkTyping(false); });
    $("t-next").addEventListener("click",function(){ sndTap(); nextTyping(); });
    $("t-skip").addEventListener("click",function(){ checkTyping(true); });
    $("t-input").addEventListener("keydown",function(e){
      if(e.key==="Enter"){
        e.preventDefault();
        if(state.answered) nextTyping(); else checkTyping(false);
      }
    });

    // 結果
    $("r-review").addEventListener("click",function(){
      sndTap();
      var rw=state.lastResult.wrong.slice();
      startQuiz(rw, Math.random()<0.5?"en-ja":"ja-en", true);
    });
    $("r-again").addEventListener("click",function(){
      sndTap();
      var r=state.lastResult;
      if(r.mode==="quiz") startQuiz(sample(scopeWords(setupCfg.scope),QPS),setupCfg.dir,false);
      else if(r.mode==="typing"){
        var pool=scopeWords(setupCfg.scope).filter(function(w){return w.pos!=="句";});
        startTyping(sample(pool,QPS),setupCfg.dir,false);
      }
      else if(r.mode==="matching") startMatching(setupCfg.scope);
    });
    $("r-home").addEventListener("click",function(){
      sndTap(); renderHome(); showScreen("screen-home");
    });

    // お祝い画面
    $("cele-btn").addEventListener("click",function(){
      sndTap();
      if(state.celebrateFromHome){ renderHome(); showScreen("screen-home"); }
      else showResult();
    });

    // たんご一覧
    $("wl-search").addEventListener("input",renderWordList);
    $("wl-filter").addEventListener("click",function(e){
      var t=e.target.closest(".pick"); if(!t) return; sndTap();
      var ch=this.children; for(var i=0;i<ch.length;i++) ch[i].classList.remove("sel");
      t.classList.add("sel"); renderWordList();
    });

    // 音 ON/OFF
    $("sound-btn").addEventListener("click",function(){
      soundOn=!soundOn;
      this.textContent=soundOn?"🔊":"🔇";
      if(soundOn) sndTap();
    });

    // あそびかた
    $("help-btn").addEventListener("click",function(){
      alert("💜 あそびかた 💜\n\n"+
        "①「カードでおぼえる」で単語をインプット\n"+
        "②「4択」「うちこみ」「マッチング」で力だめし（10問）\n"+
        "③ まちがえた単語は「まちがい復習」に自動で集まるよ\n"+
        "④ 10問ぜんぶ正解すると…BTSメンバーが1人ずつ仲間入り！\n"+
        "　 めざせ7人コンプリート💜\n\n"+
        "がんばってね！ Borahae 💜");
    });

    // キーボード（4択：1〜4で回答）
    document.addEventListener("keydown",function(e){
      if(!$("screen-quiz").classList.contains("hidden")){
        if(e.key>="1"&&e.key<="4"){
          var cs=document.querySelectorAll("#q-choices .choice");
          var n=parseInt(e.key,10)-1;
          if(cs[n] && !cs[n].disabled) cs[n].click();
        }
        if(e.key==="Enter" && !$("q-next").classList.contains("hidden")) $("q-next").click();
      }
    });

    showScreen("screen-home");
  });
})();
</script>
</body>
</html>
